spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:job-module-test;DB_CLOSE_DELAY=-1;database_to_upper=true
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/job-schema.sql
      data-locations: classpath:sql/job-data.sql

jimmer:
  database-validation-mode: ERROR
  show-sql: false

core:
  default-tenant: default
  security:
    secret-key: job-module-test-secret-key-0123456789abcdef
    expire-hours: 1
